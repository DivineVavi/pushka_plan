services:
  pushka:
    build: .
    restart: unless-stopped
    environment:
      PUSHKA_DB: /var/lib/pushka/pushka.sqlite3
      CATALOG_SNAPSHOT_PATH: ${CATALOG_SNAPSHOT_PATH:-/app/data/catalog-snapshot.sqlite3}
      MAX_BOT_TOKEN: ${MAX_BOT_TOKEN:-}
      MAX_WEBHOOK_SECRET: ${MAX_WEBHOOK_SECRET:-}
      MAX_WEB_APP_ID: ${MAX_WEB_APP_ID:-t99_hakaton_max_bot}
      PUBLIC_URL: ${PUBLIC_URL:-}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      DEMO_COOKIE_KEY: ${DEMO_COOKIE_KEY:-}
    ports:
      - "${PUSHKA_BIND_IP:-127.0.0.1}:${PUSHKA_HOST_PORT:-8000}:8000"
    volumes:
      - pushka-data:/var/lib/pushka
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  pushka-data:
